/* ── the map's palette, restyled entirely from outside the component ──── */
/* The first map is not in this list: its palette is a preset, written into a
   stylesheet of its own by applySkin() so the same object can also be handed
   to render() for the download. Everything below is the same idea, fixed. */
#paint .ukr-map, #alerts .ukr-map, #fold .ukr-map, .rrow .ukr-map {
  --ukr-land: #e7e3d6;
  --ukr-line: #a8a294;
  --ukr-outline: #6f6a5c;
  --ukr-water: #5891b6;         /* one blue: rivers, reservoirs and the sea */
  --ukr-glow: .3;               /* the shallow band is the same blue, softer */
  --ukr-hi: #dcd6c9;
  --ukr-text: #302c24;
  --ukr-halo: #fffff8;          /* the page color, so haloes disappear */
  --ukr-font: "Ubuntu Condensed", "Arial Narrow", sans-serif;
  --ukr-dur: .52s;
}
/* not colors, so they sit outside the presets */
#map .ukr-map { --ukr-font: "Ubuntu Condensed", "Arial Narrow", sans-serif; --ukr-dur: .52s; }
#map .ukr-region { cursor: pointer; }
/* A map drawn for a dark ground is a hole in a cream page, so the one preset
   that needs something of the page gets it — from the page, not the map. */
/* The ground is a box-shadow spread, not padding: the component reads
   el.clientWidth to get its map-units-per-pixel, and padding is inside it. */
#map { margin: .7rem 0; border-radius: 3px; transition: background-color .3s, box-shadow .3s; }
#map[data-skin="night"] { background: #191a18; box-shadow: 0 -.2rem 0 0.9rem #191a18; }

  min-height: 2.6rem; margin: .1rem 0 0; font-size: 1rem; color: #56514a;
  display: flex; flex-wrap: wrap; gap: .1rem 1.7rem; align-items: baseline;
}
#readout .nm { color: #111; font-size: 1.12rem; }
#readout .sub { font-style: italic; }
#readout dl { display: flex; gap: 1.5rem; margin: 0; flex-wrap: wrap; }
#readout div { display: flex; gap: .4rem; align-items: baseline; }
#readout dt { font-variant: small-caps; letter-spacing: .06em; color: #8d8677; }
#readout dd { margin: 0; font-variant-numeric: tabular-nums; color: #302c24; }

/* ── the grid, in the margin ──────────────────────────────────────────── */
.foldnote .act { margin: .2rem 0 .5rem; }
@media (prefers-reduced-motion: reduce) {
  /* The plugin turns its transition off under this setting, and on a page that
     animates at the reader it would be right. Here the animation IS the thing
     being shown, and it only runs when the button is pressed, so this one map
     keeps it. Nothing else on the page moves. */
  #fold .ukr-stage { transition: height var(--ukr-dur, .5s)
                     var(--ukr-ease, cubic-bezier(.62,0,.28,1)); }
  #fold .ukr-unit  { transition: transform var(--ukr-dur, .5s)
                     var(--ukr-ease, cubic-bezier(.62,0,.28,1)); }
  #fold .ukr-borders, #fold .ukr-outline, #fold .ukr-coast,
  #fold .ukr-coastglow, #fold .ukr-water { transition: opacity .34s linear; }
  /* the same shortening the plugin does on the way home, so the furniture is
     back before the tiles give up their own outlines */
  #fold .is-moving > .ukr-borders, #fold .is-moving > .ukr-outline,
  #fold .is-moving > .ukr-coast, #fold .is-moving > .ukr-coastglow,
  #fold .is-moving > .ukr-water { transition-duration: .2s; }
  #fold .ukr-tilewater, #fold .ukr-tilecoast, #fold .ukr-tileglow {
    transition: opacity .25s linear; }
}

/* ── recipes ──────────────────────────────────────────────────────────── */
.small-map { max-width: 400px; }

/* the overlay is plain absolutely-positioned HTML — the map hands over a

.pinwrap { position: relative; max-width: 620px; }
.pin { position: absolute; transform: translate(-50%, -100%);

       background: #fdfdfbdd; border: 1px solid #ccc6b8; border-radius: 3px;

.pin::after { content: ''; position: absolute; left: 50%; top: 100%;

.legend { display: flex; flex-wrap: wrap; gap: .3rem 1.4rem; font-size: .92rem;

@keyframes pulse { 50% { --c: #8d221e; } }
@media (prefers-reduced-motion: reduce) { #alerts .m-alert { animation: none } }

.scale { display: flex; flex-direction: column; gap: .3rem; max-width: 620px;

.scale .bar { position: relative; height: .9rem; border-radius: 2px; }

.scale .bar i { position: absolute; top: 0; bottom: 0; width: 1px;

.scale .ticks { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }

      h2data: 'Як улаштовані дані',

    en: {
      docTitle: 'ukrmap · a small map of Ukraine',
      meta: 'A map of Ukraine’s regions: an image file, not a library. Hover on real region edges, native tooltips, data-driven color from one CSS rule, <span class="keep-together">ISO 3166-2</span> codes.',
      sub: 'A map of Ukraine’s regions for websites, the press and statistical reports',
      lead: 'It is an image file, not a library. Inline the SVG and hover follows the real shape of a region rather than a bounding box, tooltips are native, and color comes from one CSS rule. '
        + 'Every region carries its <span class="keep-together">ISO 3166-2</span> code, so a table of data lands on the map without a translation step.',
      ship: 'This page is both a demo and a how-to. The map below is mounted by the component: without it there would be no controls and no readout. Everything else you see is the file. What you ship is that SVG, or the <span class="keep-together">{code} KB</span> gzipped component.',
      mnFiles: '<b>Ready-made files.</b> If there is nothing to set up, take one as it is:<br>'
        + '<a href="../dist/ua-en.svg">ua-en.svg</a> — the default, for the web<br>'
        + '<a href="../dist/ua-blank.svg">ua-blank.svg</a> — geometry only, no labels<br>'
        + '<a href="../dist/ua-flat-en.svg">ua-flat-en.svg</a> — colors in attributes, 1600 px, for Figma and Keynote<br>'
        + '<a href="../dist/ua-print.svg">ua-print.svg</a> — 700 m, every river (Ukrainian labels)<br>'
        + 'Data separately: <a href="../dist/ua-facts.json">ua-facts.json</a>, '
        + '<a href="../dist/ua-wgs84.geo.json">ua-wgs84.geo.json</a>.',
      caption: 'Geometry: Natural Earth 10m admin-1, Lambert Conformal Conic with standard parallels at 44.5° and 52°, simplified as a topology at a 1.4 km interval. Administrative centers are at their true projected coordinates; each label is placed by hand to stay inside its region.',
      mnFold: '<b>Where this map comes from.</b> In 2012 it was a PNG sprite with <code>&lt;map&gt;&lt;area shape="poly"&gt;</code>: the hit areas were traced by hand, but they followed the real borders — <a href="https://keymasterr.com/micro/ukrmap/2012/">the original is still next door</a>. Hover on the true shape of a region survived from there, and so did the grid: the unfolding fell out of those same tiles almost by accident, and it was good enough to be worth choosing an order for — the one where regions cross each other least on the way, three bands west to east. Here it is mostly an in-joke; if it is your kind of joke, it is one extra file, <code>ukrmap-unfold.js</code>.',
      mnSyvash: '<b>The Syvash, and the shape of Crimea.</b> Natural Earth files the Syvash with the lakes, so the administrative polygons cover it as land, and on a small-scale map the strip between Kherson and Crimea comes out solid. The build pulls the lagoons — the Syvash and the Dniester Liman — into a layer of their own and erases them from the land before projecting.',
      mnFont: '<b>The component doesn’t ship a font.</b> Labels ask for <code>--ukr-font</code> and fall back to a condensed system stack. This page loads Ubuntu Condensed, the font the hand-tuned label offsets were measured against.',
      h2use: 'Using it',
      h3file: '1 · Just the file',
      pfile: '<b>The map above is the file.</b> Set it up (language, labels, water, Kyiv, palette) and press <b>save</b>. <b>SVG</b> at 1600 px with the colors in attributes — for Illustrator, Figma or print; <b>PNG</b> at 2400 px for Word, Google Slides, Telegram and anything else that doesn’t support SVG. Nothing to install.',
      pfile2: 'The same works from a terminal, for a build step or a bot that redraws the map every hour. All the flags are in the README: the levels for <code>--detail</code> are in the table further down, and <code>--width</code> asks for a different size.',
      prefile: 'npx github:keymasterr/ukrmap -o ua.svg\n\n'
        + '<span class="c"># color it from a table: {"UA-46": "#c0392b", …}</span>\n'
        + 'npx github:keymasterr/ukrmap --data values.json -o ua.svg\n\n'
        + '<span class="c"># your own palette — the same keys as the CSS custom properties</span>\n'
        + 'npx github:keymasterr/ukrmap --palette land=#e7e3d6,water=#5891b6 -o ua.svg',
      h3embed: '2 · Put it on a page',
      h3css: '3 · Interactive, still no JavaScript',
      pcss: 'Every region carries its <span class="keep-together">ISO 3166-2</span> code in <code>data-key</code> and its name in a <code>&lt;title&gt;</code>. From there your stylesheet does the rest: a region’s color is one custom property, <code>--c</code>.',
      precss: '&lt;style&gt;\n'
        + '  .ukr-region:hover      { --c: #a5402f }   <span class="c">/* true-edge hover */</span>\n'
        + '  [data-key="UA-46"]     { --c: #c0392b }   <span class="c">/* Lviv */</span>\n'
        + '  [data-key="UA-63"]     { --c: #e8b04b }   <span class="c">/* Kharkiv */</span>\n'
        + '&lt;/style&gt;',
      h3comp: '4 · The component',
      pcomp: 'Only needed for what CSS cannot do: switching layouts and recoloring from live data.',
      precomp: '&lt;div id="m"&gt;&lt;/div&gt;\n'
        + '&lt;script src="ukrmap.js"&gt;&lt;/script&gt;\n'
        + '&lt;script src="data.js"&gt;&lt;/script&gt;\n'
        + '&lt;script src="ukrmap-unfold.js"&gt;&lt;/script&gt;  <span class="c">// the unfolded view only</span>\n'
        + '&lt;script&gt;\n'
        + '  const map = UkrMap(\'#m\', { data: UKR_DATA });\n'
        + '  UkrMap.unfold(map);                     <span class="c">// adds map.view()</span>\n\n'
        + '  map.view(\'grid\');                        <span class="c">// map | grid</span>\n'
        + '  map.set({ \'UA-46\': \'#c0392b\' });         <span class="c">// choropleth</span>\n'
        + '  map.mark({ \'UA-46\': \'alert\' });          <span class="c">// adds .m-alert</span>\n'
        + '  map.update({ labels: \'region\' });        <span class="c">// no re-render</span>\n'
        + '&lt;/script&gt;',
      h2data: 'What’s in the data',
      pdata: 'One file per detail level. It’s a topology, not a set of polygons: every arc is stored once and each region is a list of arc indices. Internal borders and the national outline aren’t stored as separate lines; they’re derived from how many regions use each arc. That’s also why Kyiv City gets the right boundary when you split it out. A detail level is a simplification interval in meters: a smaller interval means more points and a heavier file.',
      thDetail: 'detail', thPoints: 'points', thFile: 'file', thUse: 'when to use it',
      usesPrint: 'print and large sizes', usesDefault: 'the default',
      usesSmall: 'if the map is no wider than 470 px',
      pcarries: 'Besides the geometry, the file carries each region’s name in Ukrainian and English, its administrative center — the name and the projected coordinates — the bounding box the unfolded layout needs, and the hand-tuned label offsets.',
      h2notes: 'Notes',
      notes: [
        '<b>Water is shown as it was before June 2023.</b> The Kakhovka Reservoir drained after the dam was destroyed. No surveyed replacement geometry exists, so instead of inventing a channel, the map keeps the reservoir at its old extent and tags it <code>data-until="2023"</code>. Style or hide it as you see fit.',
        '<b>Population figures predate the full-scale invasion</b> (1 January 2022; Crimea and Sevastopol: 2014, the last data Ukraine published). They’re there for scale and aren’t current.',

        '<b>Kirovohrad Oblast’s center is Kropyvnytskyi, and Dnipropetrovsk Oblast’s is Dnipro</b> — both renamed in 2016, after the original version of this map.',

      footer: 'Code and files: <a href="https://github.com/keymasterr/ukrmap">github.com/keymasterr/ukrmap</a>, MIT. '

      pembed: 'You have a file by now — your own from the save button, or a ready-made one from the list beside the map. '

      preembed: '<span class="c">&lt;!-- 1. as an image: simplest, but your CSS can’t reach inside.</span>\n'

      h2export: 'Recipe: a map of a number',
      pexport: 'Population density, from the same <code>ua-facts.json</code> that already ships with '
        + '<code>UkrMap.colorData()</code> reads the range off the data — logarithmically here, '
        + 'because density is a multiplicative quantity: Kyiv is twenty times denser than '
        + 'its oblast, and the scale should say so rather than level everyone into a queue. '
        + 'Then <code>set()</code> puts the color on and <code>title()</code> puts the number '
        + 'into the native tooltip the map already has. Hover a region.',
      capexport: 'Kyiv is split out from its oblast here: 3,518 people per km² against 64. Merged, '
        + 'they hide each other. To get a map like this as a file, use the <b>save</b> buttons under '
        + 'the first map — the SVG writes its colors onto the elements, because Figma and Keynote '
        + 'do not read CSS custom properties.',
      preexport: '<span class="c">// people per km²</span>\n'
        + 'const dens = {\n'
        + '  \'UA-30\': 3518,   <span class="c">// Kyiv</span>\n'
        + '  \'UA-14\': 153, \'UA-46\': 113, \'UA-77\': 110,\n'
        + '  \'UA-21\': 97,    <span class="c">// … and so on for all 26</span>\n'
        + '};\n\n'
        + 'const s = UkrMap.colorData(dens, { spread: \'log\' });\n'
        + 'map.set(s.fills);   <span class="c">// range read off the data</span>\n\n'
        + '<span class="c">// the value, into the tooltip that is already there</span>\n'
        + 'const titles = {};\n'
        + 'for (const key in dens) titles[key] = map.name(key) + \': \' + dens[key];\n'
        + 'map.title(titles);\n\n'
        + '<span class="c">// for a legend: s.at(0…1), s.valueAt(0…1), s.posOf(value)</span>',

      h2list: 'Recipe: one SVG per region',
      plist: 'Each region comes back as its own small SVG, and everything around it stays ordinary HTML — styleable, selectable, accessible. <code>scale</code> sets the same pixels per map unit for every region, so the shapes are comparable in size.',
      prelist: '<span class="c">// in the browser</span>\n'
        + 'el.innerHTML = UkrMap.regionSvg(UKR_DATA, \'UA-46\', { scale: 160 });\n\n'
        + '<span class="c">// or one file per region, plus regions.json</span>\n'
        + 'npx github:keymasterr/ukrmap --split ./regions --scale=160 --style=attrs',
      legAlert: 'alert', legPartial: 'partial',
      ctl: {
        labels: 'labels', water: 'water', kyiv: 'Kyiv',
        skin: 'palette',
        paper: 'paper', ink: 'print', atlas: 'atlas', night: 'night',
        unfold: 'unfold', fold: 'fold back',
        city: 'city', region: 'region', none: 'none',
        on: 'on', off: 'off', all: 'every river',
        merged: 'in the oblast', split: 'separate',
        save: 'save', svg: 'SVG', png: 'PNG', pngfail: 'failed',
      },
      h2pins: 'Your own elements, by coordinates',
      ppins: 'The map knows its own projection, so <code>map.project(lon, lat)</code> returns a point in both map units and container pixels. Whatever you put there is ordinary absolutely positioned HTML; the styling, z-index and behavior are all yours. The result differs from PROJ by less than a meter.',
      prepins: 'const p = map.project(30.5234, 50.4501);   <span class="c">// longitude first</span>\n'
        + 'pin.style.left = p.left + \'px\';\n'
        + 'pin.style.top  = p.top  + \'px\';\n\n'
        + '<span class="c">// p.x, p.y are the same point in map units, no DOM:</span>\n'
        + '<span class="c">// UkrMap.project(UKR_DATA, lon, lat)</span>',
      ro: { center: 'center', area: 'area', pop: 'population', dens: 'density',
            unit: 'people/km²',
            km2: 'km²', mln: 'M', perkm: '/km²', hint: 'Hover over a region.' },
    },
  };

  /* ---------------------------------------------------------------- state */
  var lang = 'uk';
  var opts = {
    data: window.UKR_DATA,
    facts: window.UKR_FACTS,    /* areas and populations ship separately */
    /* Split by default. Every statistical table has Kyiv City as its own row,
       and its density is 3,518 against the oblast's 64 — merged, each hides the
       other. The library still defaults to the 25 a reader expects to see; this
       is the demo choosing the honest one for data work. */
    lang: lang, labels: 'city', water: true, kyivSeparate: true,
  };
  var waterMode = 'on';                 /* 'on' | 'off' | 'all' */
  var skin = 'paper';
  var map = null, current = null, foldMap = null, unfolded = false;

  /* ------------------------------------------------------------- presets
     One object per skin, in the shape `palette` takes — which is also, key for
     key, the set of custom properties the stylesheet knows. That is the point
     of keeping them here rather than in the CSS above: the live map is
     restyled by writing them into a stylesheet, and the SVG the save buttons
     hand over is rendered with the same object as `palette`, so the file
     matches what is on screen instead of arriving in the default sand.

     Only what actually moves is listed. A preset is a partial override, so
     anything left out keeps the library's value and cannot drift from it. */
  var VAR = {
    land: 'land', line: 'line', outline: 'outline', water: 'water',
    glowAlpha: 'glow', waterOp: 'waterop', hi: 'hi', text: 'text',
    halo: 'halo', edge: 'edge', hover: 'hover', font: 'font',
  };
  var SKINS = {
    /* the page's own colors: cream land, one blue for everything wet, and a
       label halo set to the paper so the haloes disappear */
    paper: {
      land: '#e7e3d6', line: '#a8a294', outline: '#6f6a5c',
      water: '#5891b6', glowAlpha: '.3',
      hi: '#dcd6c9', text: '#302c24', halo: '#fffff8',
    },
    /* one ink: the water reads as a lighter gray than the land, not as a
       color, and the hover has to work harder without one */
    ink: {
      land: '#ececec', line: '#828282', outline: '#565656',
      water: '#a9a9a9', glow: '.5', hi: '#c2c2c2',
      text: '#000', halo: '#ffffff73', hover: '7%',
    },
    /* the school atlas: green land, a firmer coast, and a warmer paper */
    atlas: {
      land: '#CFD7A9', line: '#BEB190', outline: '#9aaf99',
      water: '#C9EBF6', glowAlpha: '.38', hi: '#cbdbb2',
      text: '#4A3830', halo: '#D5DCB3',
    },
    /* No dark mode ships, on purpose — the library will not guess the host's
       intent from the OS. This is the four lines of CSS the README says it
       takes, with the page supplying the dark ground behind it. */
    night: {
      land: '#333733', line: '#252422', outline: 'transparent',
      water: '#365466', glowAlpha: '.34', hi: '#5b95e8',
      text: '#e7e4dc', halo: '#191a18', hover: '9%',
    },
  };

  /* A stylesheet of its own, appended after the page's, so it wins on source
     order without an !important or an id — and so the map is restyled from
     outside the component, exactly as a host would do it. */
  var skinCss = document.createElement('style');
  document.head.appendChild(skinCss);

  function applySkin(name) {
    skin = SKINS[name] ? name : 'paper';
    var p = SKINS[skin], decl = [];
    for (var k in p) if (VAR[k]) decl.push('--ukr-' + VAR[k] + ':' + p[k]);
    skinCss.textContent = '#map .ukr-map{' + decl.join(';') + '}';
    document.getElementById('map').dataset.skin = skin;
  }

  var CONTROLS = [
    { name: 'labels', items: [['city', 'city'], ['region', 'region'], ['none', 'none']] },
    { name: 'water',  items: [['on', 'on'], ['off', 'off'], ['all', 'all']] },
    { name: 'kyiv',   items: [['merged', 'merged'], ['split', 'split']] },
    { name: 'skin',   items: [['paper', 'paper'], ['ink', 'ink'],
                              ['atlas', 'atlas'], ['night', 'night']] },
    /* Not a setting — the way out. Everything above configures the map; this
       hands the result over, which is what the CLI is for and what a newsroom
       without a terminal has had no way to reach. */
    { name: 'save', act: true, items: [['svg', 'svg'], ['png', 'png']] },
  ];

  function currentValue(name) {
    if (name === 'labels') return opts.labels;
    if (name === 'water') return waterMode;
    if (name === 'skin') return skin;
    return opts.kyivSeparate ? 'split' : 'merged';
  }

  function choose(name, value) {
    if (name === 'skin') { applySkin(value); syncControls(); return; }
    if (name === 'labels') { opts.labels = value; map.update({ labels: value }); }
    if (name === 'water') {
      waterMode = value;
      map.update({ water: value === 'off' ? false : value === 'all' ? { rivers: 'all' } : true });
    }
    if (name === 'kyiv') {
      opts.kyivSeparate = value === 'split';
      map.update({ kyivSeparate: opts.kyivSeparate });
      current = null;
    }
    syncControls();
    showCurrent();
  }

  /* ---------------------------------------------------------------- paint */
  function buildControls() {
    var t = TEXT[lang].ctl;
    var host = document.getElementById('controls');
    host.textContent = '';
    CONTROLS.forEach(function (c) {
      var wrap = document.createElement('span');
      wrap.className = 'control';
      wrap.dataset.name = c.name;
      var lbl = document.createElement('span');
      lbl.className = 'lbl';
      lbl.textContent = t[c.name];
      wrap.appendChild(lbl);
      c.items.forEach(function (item, i) {
        if (i && !c.act) wrap.appendChild(document.createTextNode(' · '));
        var b = document.createElement('button');
        b.textContent = t[item[1]];
        b.dataset.value = item[0];
        if (c.act) {
          b.className = 'act';
          b.onclick = function () { save(item[0], b); };
        } else {
          b.onclick = function () { choose(c.name, item[0]); };
        }
        wrap.appendChild(b);
      });
      host.appendChild(wrap);
    });
    syncControls();
  }

  function syncControls() {
    Array.prototype.forEach.call(document.querySelectorAll('.control'), function (wrap) {
      if (wrap.dataset.name === 'save') return;
      var cur = String(currentValue(wrap.dataset.name));
      Array.prototype.forEach.call(wrap.querySelectorAll('button'), function (b) {
        b.setAttribute('aria-pressed', String(b.dataset.value === cur));
      });
    });
  }

  function paintFoldButton() {
    var t = TEXT[lang].ctl;
    document.getElementById('foldToggle').textContent = unfolded ? t.fold : t.unfold;
  }

  function buildLangSwitch() {
    var host = document.getElementById('lang');
    host.textContent = '';
    [['uk', 'українська'], ['en', 'English']].forEach(function (pair) {
      var b = document.createElement('button');
      b.textContent = pair[1];
      b.dataset.value = pair[0];
      b.setAttribute('aria-pressed', String(pair[0] === lang));
      b.onclick = function () { setLang(pair[0]); };
      host.appendChild(b);
    });
  }

  /* Sizes in the prose come from build/demo.js, which measures the files it
     just copied. Typed by hand they drifted: the page advertised a 9.4 KB
     component long after it had grown to nearly twice that. */
  function fill(html) {
    var c = window.UKR_CODE || {};
    return String(html).replace(/\{(code|core|geo)\}/g, function (_, k) {
      var v = k === 'code' ? c.total : k === 'core' ? c.core : c.geo;
      return v == null ? '?' : (lang === 'uk' ? String(v).replace('.', ',') : v);
    });
  }

  function paintCopy() {
    var T = TEXT[lang];
    document.documentElement.lang = lang;
    document.title = T.docTitle;
    /* the description is copy too, and a link preview reads it */
    var meta = {
      'meta[name=description]': T.meta,
      'meta[property="og:description"]': T.meta,
      'meta[property="og:title"]': T.docTitle,
    };
    for (var sel in meta) {
      var tag = document.querySelector(sel);
      if (tag && meta[sel]) tag.setAttribute('content', meta[sel]);
    }
    Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (el) {
      var v = T[el.dataset.t];
      if (v === undefined) return;
      el.innerHTML = fill(Array.isArray(v)
        ? v.map(function (li) { return '<li>' + li + '</li>'; }).join('')
        : v);
    });
    buildLangSwitch();
    buildControls();
    paintFoldButton();
    placePins();          /* the pin labels are copy too */
    buildSizes();
    alertLegend();
    if (paintMap) buildRegionList();
  }

  function setLang(l) {
    if (l === lang) return;
    lang = l;
    opts.lang = l;
    paintCopy();
    map.update({ lang: l });     /* labels swap in place — the map does not blink */
    if (foldMap) foldMap.update({ lang: l });
    if (alertMap) alertMap.update({ lang: l });
    if (paintMap) { paintMap.update({ lang: l }); paintDensity(); buildScale(); }
    showCurrent();
  }

  /* ---------------------------------------------------------------- readout */
  var ro = document.getElementById('readout');
  var fmt = function (v) { return v.toLocaleString(lang === 'uk' ? 'uk-UA' : 'en-GB'); };

  function showCurrent() {
    var T = TEXT[lang].ro;
    if (!current) { ro.innerHTML = '<span class="sub">' + T.hint + '</span>'; return; }
    var u = current[1], head = u.head;
    var rows = [
      [T.center, UkrMap.cityName(head, lang)],
      [T.area, fmt(u.area) + ' ' + T.km2],
      [T.pop, (u.pop / 1000).toFixed(2) + ' ' + T.mln],
      [T.dens, Math.round(u.pop * 1000 / u.area) + T.perkm],
    ];
    ro.innerHTML =
      '<span class="nm">' + UkrMap.fullName(head, lang) + '</span>'
      + '<span class="sub">' + UkrMap.fullName(head, lang === 'uk' ? 'en' : 'uk')
      + ' · ' + head.k + '</span>'
      + '<dl>' + rows.map(function (r) {
          return '<div><dt>' + r[0] + '</dt><dd>' + r[1] + '</dd></div>';
        }).join('') + '</dl>';
  }

  /* the size table is measured at build time, not typed out here */
  function buildSizes() {
    var T = TEXT[lang];
    var use = { 700: T.usesPrint, 1400: T.usesDefault, 2800: T.usesSmall };
    var nf = function (v) { return v.toLocaleString(lang === 'uk' ? 'uk-UA' : 'en-GB'); };
    document.querySelector('#sizes tbody').innerHTML = (window.UKR_SIZES || []).map(function (r) {
      return '<tr><td><code>--detail=' + r.detail + '</code></td>'
        + '<td class="num">' + nf(r.points) + '</td>'
        + '<td class="num">' + r.kb + ' KB</td>'
        + '<td class="num">' + r.gzip + ' KB</td>'
        + '<td>' + (use[r.detail] || '') + '</td></tr>';
    }).join('');
  }

  /* ------------------------------------------------------- recipe: alerts */
  /* Two states, not three. "Clear" was a color for the absence of a thing,
     which the map already draws: a region nobody marked is a region with no
     alert, and giving that its own swatch made the legend explain something
     the reader was not asking about. */
  var ALERT_STATES = ['alert', 'partial'];
  var alertMap = null, alertTimer = null;

  function alertLegend() {
    var T = TEXT[lang];
    document.getElementById('alertLegend').innerHTML = [
      ['#c4302b', T.legAlert], ['#d99a2b', T.legPartial],
    ].map(function (r) {
      return '<span><i style="background:' + r[0] + '"></i>' + r[1] + '</span>';
    }).join('');
  }

  function rollAlerts() {
    /* stand-in for a feed: names as a real one would give them, resolved
       through map.resolve() rather than assumed to be ISO codes */
    var names = ['Львівська область', 'Харківська область', 'Одеська область',
                 'Дніпропетровська область', 'Запорізька область', 'Сумська область',
                 'Chernihiv Oblast', 'м. Київ', 'Kyiv Oblast', 'Донецька область',
                 'Херсонська область', 'Миколаївська область'];
    var state = {};
    names.forEach(function (nm, i) {
      var key = alertMap.resolve(nm);
      if (!key) return;
      /* a third of them stay unmarked, which is what "no alert" looks like */
      var slot = (Math.floor(Date.now() / 3000) + i * 2) % 3;
      if (slot === 2) return;
      state[key] = ALERT_STATES[slot];
    });
    alertMap.mark(state);
  }

  /* ------------------------------------------------- recipe: a choropleth
     Real numbers, not a paint box. Population density is the one quantity the
     shipped facts file can produce on its own — area and population are both
     in it — so nothing on this map is invented. */
  var paintMap = null, dens = null, densScale = null;

  /* set() puts the color on, title() puts the number in the tooltip that is
     already there — which is the whole of "a choropleth with values" without a
     tooltip library anywhere near it. */
  /* One call does the colors: the range comes off the data, and the classes
     are quantiles because the table is skewed — Kyiv is 3,518 against a median
     of 60, and five equal slices of that would be one map-colored bucket. */
  function paintDensity() {
    if (!paintMap) return;
    var T = TEXT[lang].ro, titles = {};
    dens = {};
    paintMap.units.forEach(function (u) { dens[u.key] = Math.round((u.pop * 1000) / u.area); });
    /* log, not the rank default: density is a multiplicative quantity, and
       log keeps the fact that Kyiv is twenty times denser rather than one
       step denser. Rank would use more of the ramp; this reads truer. */
    densScale = UkrMap.colorData(dens, { spread: 'log' });
    paintMap.units.forEach(function (u) {
      titles[u.key] = UkrMap.fullName(u.head, lang) + ': ' + dens[u.key] + ' ' + T.perkm;
    });
    /* set() puts the color on, title() puts the number into the tooltip the
       map already has — a choropleth with readable values and no tooltip code */
    paintMap.set(densScale.fills).title(titles);
  }

  /* The bar is the ramp; the hairlines on it are the twenty-six regions, each
     at its own position. posOf() is the scale read backwards, so a mark cannot
     disagree with the color under it, and the rug is the argument for the log
     spread made visible instead of asserted: a crowd below a hundred, then Kyiv
     alone at the far end. Only the two ends are labelled — they are the only
     positions a reader can point at, and a number printed in the middle of a
     log ramp claims to be the middle of the data, which it is not. */
  function buildScale() {
    if (!densScale) return;
    var host = document.getElementById('densScale');
    var T = TEXT[lang].ro;
    var stops = [0, 0.25, 0.5, 0.75, 1];
    var d = densScale.domain;
    var marks = paintMap.units.map(function (u) {
      /* not the two extremes: the bar already starts at one and ends at the
         other, and a hairline on a rounded corner only argues with it */
      var v = dens[u.key], t = densScale.posOf(v);
      if (t <= 0 || t >= 1) return '';
      return '<i style="left:' + (t * 100).toFixed(2) + '%" title="'
        + UkrMap.fullName(u.head, lang) + ': ' + v + T.perkm + '"></i>';
    }).join('');
    host.innerHTML =
      '<div class="unit">' + T.dens + ', ' + T.unit + '</div>'
      + '<div class="bar" style="background:linear-gradient(90deg,'
        + stops.map(function (t) { return densScale.at(t); }).join(',') + ')">'
        + marks + '</div>'
      + '<div class="ticks"><span>' + Math.round(d[0]) + '</span>'
        + '<span>' + fmt(Math.round(d[1])) + '</span></div>';
  }

  function saveBlob(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  /* ------------------------------------------------- the demo as the CLI
     The controls above are the flags; these two are `-o`. Whatever is on
     screen — language, labels, water, Kyiv — is what comes down, so someone
     who will never run npx still gets the file they came for. */
  var PNG_W = 2400;
  /* The SVG comes down at a stated size, because a baked file's line weights
     are only right at one. 1600 px is a layout: big enough to place on a
     spread, small enough that nobody has to resize it — and resizing is where
     the weights go wrong, since a design tool honors neither the custom
     properties nor the non-scaling strokes a browser uses. The raster is
     twice a screen's worth and keeps the widths it has: downsampled to the
     size a slide shows it, they land where they should. */
  var SVG_W = 1600;

  function currentOptions() {
    return {
      lang: lang,
      labels: opts.labels,
      water: waterMode === 'off' ? false : waterMode === 'all' ? { rivers: 'all' } : true,
      kyivSeparate: opts.kyivSeparate,
      /* the preset on screen, baked into the file: `palette` is a partial
         override, so an untouched color still comes from the library */
      palette: SKINS[skin],
    };
  }

  function currentName(ext) {
    var o = currentOptions();
    return ['ukraine', o.lang, o.labels === 'none' ? 'blank' : o.labels]
      .concat(o.kyivSeparate ? ['kyiv'] : [])
      .concat(skin === 'paper' ? [] : [skin]).join('-') + '.' + ext;
  }

  function save(kind, button) {
    var o = currentOptions();
    /* attrs, not inline: a downloaded file gets opened in Illustrator and
       pasted into Keynote at least as often as it gets put on a page, and
       neither of those reads a CSS custom property. */
    if (kind === 'svg') {
      var file = UkrMap.render(window.UKR_DATA,
        Object.assign({ style: 'attrs', width: SVG_W }, o));
      return saveBlob(new Blob([file], { type: 'image/svg+xml' }), currentName('svg'));
    }

    var svg = UkrMap.render(window.UKR_DATA, Object.assign({ style: 'attrs' }, o));
    var d = window.UKR_DATA, pad = UkrMap.defaults.pad;
    var vbW = d.size[0] + pad * 2, vbH = d.size[1] + pad * 2;
    var w = PNG_W, h = Math.round(w * vbH / vbW);
    /* <img> needs the intrinsic size stated; a viewBox alone is not enough
       in every browser, and getting it wrong is how the raster ends up 300px */
    var sized = svg.replace('<svg ', '<svg width="' + w + '" height="' + h + '" ');
    var url = URL.createObjectURL(new Blob([sized], { type: 'image/svg+xml' }));
    var img = new Image();
    var label = button.textContent;
    button.disabled = true;
    var done = function () { button.disabled = false; button.textContent = label; URL.revokeObjectURL(url); };
    img.onload = function () {
      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      /* left transparent on purpose — the map never paints a sea fill, and a
         transparent PNG drops onto a slide of any color */
      c.toBlob(function (blob) {
        if (blob) saveBlob(blob, currentName('png'));
        done();
      }, 'image/png');
    };
    img.onerror = function () { button.textContent = TEXT[lang].ctl.pngfail; done(); };
    img.src = url;
  }

  /* --------------------------------------- recipe: your own HTML by coordinate
     Five real places, none of them an oblast center, so nothing here could be
     arriving from the label table by accident. The map returns a point; the
     markup, the styling and the positioning are all the host's. */
  var pinMap = null;
  var PINS = [
    { ll: [31.1828, 48.4501], uk: 'Географічний центр', en: 'Geographic center' },
    { ll: [24.5003, 48.1600], uk: 'Говерла, 2061 ', en: 'Hoverla, 2,061 m' },
    // { ll: [33.8700, 46.4510], uk: 'Асканія-Нова', en: 'Askania-Nova' },
    // { ll: [32.9700, 46.5900], uk: 'Олешківські піски', en: 'Oleshky Sands' },
    { ll: [34.2000, 46.0500], uk: 'Сиваш', en: 'Syvash' },
    // { ll: [29.6500, 45.2200], uk: 'Дунай', en: 'Danube' },
  ];

  function placePins() {
    if (!pinMap) return;
    var host = document.getElementById('pinwrap');
    Array.prototype.forEach.call(host.querySelectorAll('.pin'), function (n) { n.remove(); });
    PINS.forEach(function (pin) {
      var p = pinMap.project(pin.ll[0], pin.ll[1]);
      if (p.left == null) return;
      var el = document.createElement('div');
      el.className = 'pin';
      el.textContent = pin[lang] || pin.en;
      el.style.left = p.left + 'px';
      el.style.top = p.top + 'px';
      host.appendChild(el);
    });
  }

  /* ---------------------------------------------- recipe: a block per region */
  function buildRegionList() {
    var host = document.getElementById('regionList');
    var keys = ['UA-46', 'UA-63', 'UA-51', 'UA-43', 'UA-77'];
    var T = TEXT[lang].ro;
    host.innerHTML = keys.map(function (k) {
      var u = paintMap.units.filter(function (x) { return x.key === k; })[0];
      return '<div class="rrow">'
        + '<div class="shape">' + UkrMap.regionSvg(window.UKR_DATA, k,
            { scale: 42, labels: 'none', style: 'attrs' }) + '</div>'
        + '<div class="meta">'
          + '<div class="rn">' + UkrMap.fullName(u.head, lang) + '</div>'
          + '<div class="rd">' + T.center + ': ' + UkrMap.cityName(u.head, lang)
          + ' · ' + fmt(u.area) + ' ' + T.km2
          + ' · ' + (u.pop / 1000).toFixed(2) + ' ' + T.mln + '</div>'
        + '</div></div>';
    }).join('');
  }

  /* ---------------------------------------------------------------- go */
  applySkin(skin);
  map = UkrMap('#map', opts);
  map.on('hover', function (k, u) { current = k ? [k, u] : null; showCurrent(); });

  /* The unfolded view lives here now, on its own small map. On the main map it
     cost more than it was worth: the plugin widens the viewBox to 1.62× so the
     grid fits, and that width is reserved in both views — Ukraine was drawn
     685 px wide in a 1120 px figure. It was also the one control whose result
     the save buttons could not hand over. */
  foldMap = UkrMap('#fold', {
    data: window.UKR_DATA, labels: 'none', water: true, lang: lang, titles: false,
  });
  UkrMap.unfold(foldMap);
  /* The stage animates its height between the two views, and in a margin note
     that means the paragraph under it hops twice per press. The box reserves
     the taller one for good: the viewBox already covers both, so its ratio is
     the height to hold. */
  var foldBox = document.getElementById('fold');
  var holdFoldHeight = function () {
    var vb = foldMap.svg.viewBox.baseVal;
    foldBox.style.aspectRatio = vb.width + ' / ' + vb.height;
  };
  holdFoldHeight();
  window.addEventListener('resize', holdFoldHeight);
  document.getElementById('foldToggle').onclick = function () {
    unfolded = !unfolded;
    foldMap.view(unfolded ? 'grid' : 'map');
    paintFoldButton();
  };
  alertMap = UkrMap('#alerts', {
    data: window.UKR_DATA, labels: 'none', water: false, lang: lang,
  });
  rollAlerts();
  alertTimer = setInterval(rollAlerts, 3000);

  pinMap = UkrMap('#pins', {
    data: window.UKR_DATA, labels: 'none', water: true, lang: lang,
  });
  placePins();
  window.addEventListener('resize', placePins);

  paintMap = UkrMap('#paint', {
    data: window.UKR_DATA, facts: window.UKR_FACTS,
    labels: 'none', water: true, lang: lang, kyivSeparate: true,
  });
  paintDensity();
  buildScale();

  paintCopy();
  showCurrent();

  window.ukrmapDemo = {
    get map() { return map; }, get alertMap() { return alertMap; },
    get paintMap() { return paintMap; },
    opts: opts, setLang: setLang,
  };
}());
</script>
</body>
</html>
